<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#000}#intro{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#000;transition:opacity .6s ease,visibility .6s ease}#intro.hidden{opacity:0;visibility:hidden;pointer-events:none}#proceed{border:0;padding:14px 30px;border-radius:999px;background:#fff;color:#000;font-size:16px;font-weight:700;cursor:pointer}#proceed:active{transform:scale(.97)}#status{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#777;font-size:12px}</style></head><body><div id="intro"><button id="proceed">Proceed</button><div id="status">Loading...</div></div><audio id="music" loop preload="auto"><source src="Char.wav" type="audio/wav"></audio><script>const intro=document.getElementById('intro'),proceed=document.getElementById('proceed'),status=document.getElementById('status'),music=document.getElementById('music');music.volume=.35;music.load();proceed.addEventListener('click',async()=>{try{await music.play();intro.classList.add('hidden')}catch(e){status.textContent='Music could not start. Please try again.'}});</script></body></html>
